services:
  backend:
    build: ./backend
    environment:
      PORT: '3002'
      DATA_FILE: /data/db.json
      # offline (default, no key needed) | anthropic
      LLM_PROVIDER: ${LLM_PROVIDER:-offline}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - auditdata:/data
    ports:
      - '3002:3002'

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  auditdata:
